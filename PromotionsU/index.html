<div class="max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-gray-900 mb-8 p-8">Available Promotions</h1>
 
    <div id="promoList" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
</div>
 
 <script>
    function loadPromos(){
      let promos = JSON.parse(localStorage.getItem("promotions")) || [];
      let container = document.getElementById("promoList");
      container.innerHTML = "";

      promos.forEach(promo => {
        container.innerHTML += `
          <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition">
            <img src="${promo.image}" alt="Promo" class="w-full h-40 object-cover">
            <div class="p-4">
              <h3 class="text-xl font-semibold text-blue-600">${promo.price}</h3>
              <p class="text-gray-700 mt-2">${promo.description}</p>
            </div>
          </div>
        `;
      });
    }

    loadPromos();
  </script>
