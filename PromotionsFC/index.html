  <div class="max-w-6xl mx-auto p-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Add promotions</h1>

    <div id="promoList" class="grid gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
  </div>

  <button id="openForm" class="fixed bottom-6 right-6 bg-indigo-950 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-3xl hover:bg-indigo-700 transition">
    +
  </button>

  <div id="formModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-indigo-950 p-6 rounded-2xl shadow-xl w-full max-w-md relative items-center justify-center">
      <button id="closeForm" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-xl">✖</button>

      <h2 class="text-2xl font-bold text-white mb-6 text-center">Add Promotion</h2>

      <form id="promoForm" class="flex flex-col gap-4">
        <input type="text" id="image" placeholder="Image URL" required
          class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-teal-500 outline-none">

        <input type="text" id="price" placeholder="Price" required
          class="border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-teal-950 outline-none">

        <textarea id="description" placeholder="Description" required
          class="border border-gray-300 rounded-lg px-4 py-2 h-24 resize-none focus:ring-2 focus:ring-teal-950 outline-none"></textarea>

        <button type="submit"
          class="bg-teal-600 text-white py-2 rounded-lg transition font-semibold">
          Save
        </button>
      </form>
    </div>
  </div>

  <script>
    const promoList = document.getElementById("promoList");
    const formModal = document.getElementById("formModal");
    const openFormBtn = document.getElementById("openForm");
    const closeFormBtn = document.getElementById("closeForm");
    const promoForm = document.getElementById("promoForm");

    openFormBtn.addEventListener("click", () => formModal.classList.remove("hidden"));
    closeFormBtn.addEventListener("click", () => formModal.classList.add("hidden"));

    function loadPromos(){
      let promos = JSON.parse(localStorage.getItem("promotions")) || [];
      promoList.innerHTML = "";

      promos.forEach((promo, index) => {
        promoList.innerHTML += `
          <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition relative">
            <img src="${promo.image}" alt="Promo" class="w-full h-40 object-cover">
            <div class="p-4">
              <h3 class="text-xl font-semibold text-blue-600">${promo.price}</h3>
              <p class="text-gray-700 mt-2">${promo.description}</p>
            </div>
            <button onclick="deletePromo(${index})" class="absolute top-2 right-2 bg-red-500 text-white px-2 py-1 text-sm rounded hover:bg-red-600">🗑</button>
          </div>
        `;
      });
    }

    promoForm.addEventListener("submit", function(e){
      e.preventDefault();

      const promo = {
        image: document.getElementById("image").value,
        price: document.getElementById("price").value,
        description: document.getElementById("description").value
      };

      let promos = JSON.parse(localStorage.getItem("promotions")) || [];
      promos.push(promo);
      localStorage.setItem("promotions", JSON.stringify(promos));

      this.reset();
      formModal.classList.add("hidden");
      loadPromos();
    });

    function deletePromo(index){
      let promos = JSON.parse(localStorage.getItem("promotions")) || [];
      promos.splice(index, 1);
      localStorage.setItem("promotions", JSON.stringify(promos));
      loadPromos();
    }

    loadPromos();
  </script>
