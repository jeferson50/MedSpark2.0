<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registrar Cashback</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-white">

  <!-- Flecha de regreso -->
<div class="absolute top-6 left-6">
  <a href="../WelcomeFC/WelcomeFC.html" class="flex items-center text-indigo-950 hover:text-indigo-800 transition">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-1" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 19l-7-7 7-7" />
    </svg>
    <span class="text-sm font-medium">Back</span>
  </a>
</div>


  <header class="text-center mt-12 mb-8 px-4">
    <h2 class="text-3xl font-bold mb-2 text-indigo-950">Cashback</h2>
    <p class="text-indigo-700">Complete the purchase details to calculate the refund.</p>
  </header>

  <!-- Formulario -->
  <div class="flex justify-center">
    <div class="bg-indigo-950 p-6 rounded-xl shadow-lg w-full max-w-md">
      <form id="form-cashback" class="space-y-4">
        <div>
          <label class="block font-medium text-teal-100">Clinic o Pharmacy/label>
          <input type="text" id="lugar" class="border border-teal-300 p-2 w-full rounded bg-white text-black" required>
        </div>

        <div>
          <label class="block font-medium text-teal-100">Purchase Total (USD)</label>
          <input type="number" id="total-compra" step="0.01" class="border border-teal-300 p-2 w-full rounded bg-white text-black" required>
        </div>

        <div>
          <label class="block font-medium text-teal-100">Refund Percentage (%)</label>
          <input type="number" id="porcentaje" step="0.01" class="border border-teal-300 p-2 w-full rounded bg-white text-black" required>
        </div>

        <div class="flex justify-between pt-4">
          <button type="submit" class="bg-indigo-700 hover:bg-teal-500 text-white px-4 py-2 rounded font-semibold">Save</button>
          <button type="reset" class="bg-gray-600 hover:bg-gray-500 text-white px-4 py-2 rounded font-semibold">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-16 text-center text-sm text-indigo-950">
    &copy; 2025 Cashback Manager. Todos los derechos reservados.
  </footer>

  <script>
document.addEventListener("DOMContentLoaded", () => {
  let form = document.getElementById("form-cashback");
  if (form) {
    form.addEventListener("submit", function(e) {
      e.preventDefault();

      let lugar = document.getElementById("lugar").value;
      let totalCompra = parseFloat(document.getElementById("total-compra").value);
      let porcentaje = parseFloat(document.getElementById("porcentaje").value);

      let monto = (totalCompra * porcentaje) / 100;
      let fecha = new Date().toISOString().split("T")[0];

      let historial = JSON.parse(localStorage.getItem("cashbacks")) || [];

      historial.push({ lugar, totalCompra, porcentaje, monto, fecha });

      localStorage.setItem("cashbacks", JSON.stringify(historial));

      alert(`Se devolvieron $${monto.toFixed(2)} de cashback ✅`);
      form.reset();
    });
  }
});
  </script>
</body>
</html>
