<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="feature-accouns.js"> </script>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'midnight-green': '#03474a',
            'gamboge': '#e4981e',
            'silver': '#9E9B9D',
            'gold': '#B47A0E',
            'sky-blue': '#03898E45',
          }
        }
      }
    }
  </script>
 </head>
<body class="font-sans text-gray-800 bg-white dark:text-gray-100 transition-colors duration-300">
<header class="flex justify-between items-center px-4 py-4 border-b border-gray-200 sticky top-0 bg-indigo-950 dark:bg-gray-900 dark:border-gray-700 z-50">
  <div class="flex items-center gap-2">
    <span class="text-x font-bold">
      <span class="text-3xl text-white">Med</span><span class="text-3xl text-cyan-400">Spark</span>
    </span>
  </div>
 
  </header>
 
  <main class="flex-grow flex justify-center items-start p-8">
    <div class="bg-white shadow-lg hover:shadow-2xl transition-shadow duration-300 rounded-xl overflow-hidden w-full max-w-2xl">
      <div class="bg-indigo-950 text-white px-6 py-5 rounded-t-xl">
          <h1 class="text-2xl font-bold tracking-wide mb-1">Edit profile</h1>
 
 
         <p class="text-sm text-cyan-400">Update your personal information</p>
       </div>
     
      <div class="p-8 bg-indigo-950">
        <form class="space-y-6">
          <div>
            <label class="block text-gray-200 font-medium mb-1 hover:shadow-xl">Name</label>
            <input type="text" placeholder="Your full name"
                class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-midnight-green focus:outline-none">
          </div>
          <div>
            <label class="block text-gray-200 font-medium mb-1 hover:shadow-xl">Email</label>
            <input type="email" placeholder="Example@email.com"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 ">
          </div>
          <div>
            <label class="block text-gray-200 font-medium mb-1 hover:shadow-xl">Password</label>
            <input type="text" placeholder="00000000"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-midnight-green focus:outline-none">
          </div>
 
          <div>
          <label class="block text-gray-200 font-medium mb-1 hover:shadow-xl">DUI</label>
            <input type="number" placeholder="123456708-9"
                  class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-midnight-green focus:outline-none">
          </div>
  <div class="profile-photo-container">
    <label for="fileUpload" class="upload-btn">Change photo </label> &nbsp;
  <input type="file" id="fileUpload" accept="image/*" onchange="previewPhoto(event)">
</div>

          <div class="flex justify-between">
            <a href="../Home/Home.html" class="bg-cyan-600 px-6 py-2 text-white rounded">Cancel</a>
            <a href="../Home/Home.html" class="px-6 py-2 bg-gamboge text-white rounded-lg shadow hover:bg-gold transition">
              Save changes
            </a>
          </div>
        </form>
      </div>
    </div>
  </main>
 
</body>
</html>
